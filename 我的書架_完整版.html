<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 我的書架</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --amber-50:#FAEEDA;--amber-100:#FAC775;--amber-400:#EF9F27;--amber-600:#854F0B;--amber-800:#633806;
  --teal-50:#E1F5EE;--teal-400:#1D9E75;--teal-600:#0F6E56;
  --coral-50:#FAECE7;--coral-400:#D85A30;--coral-600:#993C1D;
  --purple-50:#EEEDFE;--purple-400:#7F77DD;--purple-600:#534AB7;
  --gray-50:#F1EFE8;--gray-200:#B4B2A9;--gray-400:#888780;--gray-600:#5F5E5A;
  --blue-50:#E6F1FB;--blue-400:#378ADD;--blue-600:#185FA5;
  --text:#1a1a18;--text-muted:#6b6b67;--text-hint:#9f9f99;
  --border:rgba(0,0,0,0.1);--border-hover:rgba(0,0,0,0.2);
  --surface:#fff;--bg:#FAF9F6;
  --r-md:8px;--r-lg:12px;--r-xl:16px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:'DM Sans',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'DM Sans',sans-serif;color:var(--text);}

/* ── Page ── */
.page{max-width:900px;margin:0 auto;padding:3rem 2rem 5rem;}

/* ── Header ── */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:0.5px solid var(--border);}
.eyebrow{font-size:10px;letter-spacing:0.1em;color:var(--text-hint);text-transform:uppercase;margin-bottom:6px;}
h1{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;line-height:1;}
h1 em{font-style:italic;color:var(--amber-600);}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.goal-pill{background:var(--amber-50);color:var(--amber-800);font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;}
.updated{font-size:10px;color:var(--text-hint);}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
.stat{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0;}
.stat.s-amber::before{background:var(--amber-400);}
.stat.s-teal::before{background:var(--teal-400);}
.stat.s-coral::before{background:var(--coral-400);}
.stat.s-purple::before{background:var(--purple-400);}
.stat-num{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--text-muted);}

/* ── Filters ── */
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;}
.chip{font-size:12px;padding:6px 15px;border-radius:20px;border:0.5px solid var(--border-hover);color:var(--text-muted);background:transparent;transition:all .15s;}
.chip:hover{color:var(--text);border-color:var(--text);}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);}
.add-main-btn{margin-left:auto;background:var(--text);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;transition:opacity .15s;}
.add-main-btn:hover{opacity:.8;}

/* ── Grid label ── */
.sec-label{font-size:10px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-hint);margin-bottom:12px;}

/* ── Cards ── */
.books-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:2rem;}
.book-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;}
.book-card:hover{transform:translateY(-2px);border-color:var(--border-hover);box-shadow:0 6px 20px rgba(0,0,0,.06);}
.spine{height:5px;}
.spine.amber{background:var(--amber-400);}
.spine.teal{background:var(--teal-400);}
.spine.coral{background:var(--coral-400);}
.spine.purple{background:var(--purple-400);}
.spine.gray{background:var(--gray-200);}
.spine.blue{background:var(--blue-400);}
.card-body{padding:14px 15px;}
.card-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.book-card:hover .card-actions{opacity:1;}
.act-btn{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--border-hover);background:var(--surface);font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.act-btn:hover{background:var(--bg);}
.bstatus{font-size:10px;font-weight:500;letter-spacing:.04em;margin-bottom:6px;}
.bstatus.done{color:var(--teal-600);}
.bstatus.reading{color:var(--blue-600);}
.bstatus.want{color:var(--gray-400);}
.bstatus.paused{color:var(--amber-600);}
.btitle{font-family:'Playfair Display',serif;font-size:15px;font-weight:500;color:var(--text);line-height:1.3;margin-bottom:3px;}
.bauthor{font-size:11px;color:var(--text-hint);margin-bottom:2px;}
.bdate{font-size:10px;color:var(--text-hint);}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:0.5px solid var(--border);}
.stars{font-size:11px;color:var(--amber-400);letter-spacing:1px;}
.stars.empty{color:var(--border-hover);}
.tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;}
.tag.amber{background:var(--amber-50);color:var(--amber-800);}
.tag.teal{background:var(--teal-50);color:var(--teal-600);}
.tag.coral{background:var(--coral-50);color:var(--coral-600);}
.tag.purple{background:var(--purple-50);color:var(--purple-600);}
.tag.gray{background:var(--gray-50);color:var(--gray-600);}
.tag.blue{background:var(--blue-50);color:var(--blue-600);}
.empty-state{grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-hint);font-size:14px;}

/* ── Divider ── */
.divider{height:0.5px;background:var(--border);margin:2rem 0;}

/* ── Spotlight ── */
.spotlight{display:grid;grid-template-columns:auto 1fr;gap:20px;background:var(--surface);border:0.5px solid var(--border);border-left:3px solid var(--amber-400);border-radius:var(--r-lg);padding:20px;margin-bottom:2rem;}
.cover-box{width:56px;height:80px;border-radius:6px;background:var(--amber-50);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.sp-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.sp-author{font-size:12px;color:var(--text-hint);margin:3px 0 10px;}
.sp-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--text-muted);line-height:1.7;}
.sp-quote::before{content:'"';font-size:22px;color:var(--amber-400);font-style:normal;vertical-align:-4px;margin-right:2px;}

/* ── Progress ── */
.prog-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.prog-title{font-size:14px;font-weight:500;}
.prog-pct{font-size:12px;color:var(--text-muted);}
.prog-sub{font-size:11px;color:var(--text-hint);margin-bottom:10px;}
.bar-track{height:6px;background:var(--gray-50);border-radius:20px;overflow:hidden;}
.bar-fill{height:100%;border-radius:20px;background:var(--teal-400);transition:width .6s ease;}
.bar-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-hint);margin-top:5px;}

/* ── Category ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:1.5rem;}
.cat-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-md);padding:14px 12px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;}
.cat-card:hover{border-color:var(--border-hover);transform:translateY(-1px);}
.cat-emoji{font-size:20px;margin-bottom:5px;}
.cat-count{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;line-height:1;margin-bottom:3px;}
.cat-name{font-size:11px;color:var(--text-muted);}

/* ── Modal overlay ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:200;align-items:center;justify-content:center;padding:1.5rem;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:var(--r-xl);padding:28px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;position:relative;}
.modal-hd{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:20px;}
.close-btn{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}

/* ── Form ── */
.form-grid{display:grid;gap:14px;}
.field-label{font-size:11px;color:var(--text-muted);margin-bottom:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.f-input,.f-select,.f-textarea{width:100%;padding:9px 12px;border:0.5px solid var(--border-hover);border-radius:var(--r-md);font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--amber-400);}
.f-textarea{resize:vertical;line-height:1.6;}
.submit-btn{width:100%;padding:11px;border-radius:20px;border:none;background:var(--text);color:#fff;font-size:13px;font-weight:500;margin-top:6px;transition:opacity .15s;}
.submit-btn:hover{opacity:.85;}
.del-btn{width:100%;padding:9px;border-radius:20px;border:0.5px solid #E24B4A;background:transparent;color:#A32D2D;font-size:13px;margin-top:6px;transition:background .15s;}
.del-btn:hover{background:#FCEBEB;}

/* ── Detail modal ── */
.detail-top{display:flex;gap:16px;margin-bottom:20px;}
.detail-cover{width:60px;height:84px;border-radius:8px;background:var(--amber-50);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.detail-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:3px;}
.detail-author{font-size:13px;color:var(--text-hint);margin-bottom:10px;}
.prop-table{width:100%;font-size:13px;border-collapse:collapse;}
.prop-table td{padding:7px 0;border-bottom:0.5px solid var(--border);}
.prop-table tr:last-child td{border-bottom:none;}
.prop-key{color:var(--text-muted);width:90px;}
.note-lbl{font-size:10px;font-weight:500;color:var(--text-hint);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px;}
.note-box{background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--text-muted);line-height:1.7;}
.quote-box{border-left:2px solid var(--amber-400);border-radius:0 var(--r-md) var(--r-md) 0;padding:10px 14px;background:var(--amber-50);font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--amber-800);line-height:1.7;margin-top:10px;}
.detail-edit-btn{width:100%;padding:10px;border-radius:20px;border:0.5px solid var(--border-hover);background:transparent;color:var(--text);font-size:13px;margin-top:16px;transition:background .15s;}
.detail-edit-btn:hover{background:var(--bg);}

/* ── Quote list in detail ── */
.quote-list{display:grid;gap:0;margin-top:6px;}
.quote-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border);}
.quote-row:last-child{border-bottom:none;}
.quote-num{font-family:'Playfair Display',serif;font-size:11px;color:var(--amber-400);font-weight:700;min-width:18px;padding-top:2px;flex-shrink:0;}
.quote-text{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--text);line-height:1.6;}

/* ── Footer ── */
.footer{margin-top:3rem;padding-top:1.5rem;border-top:0.5px solid var(--border);display:flex;justify-content:space-between;font-size:11px;color:var(--text-hint);}

@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .books-grid{grid-template-columns:repeat(2,1fr);}
  .cat-grid{grid-template-columns:repeat(2,1fr);}
  h1{font-size:30px;}
  .header{flex-direction:column;align-items:flex-start;gap:1rem;}
  .field-row,.field-row-3{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <div>
      <div class="eyebrow">Reading Tracker · 書單紀錄</div>
      <h1>我的<em>書架</em></h1>
    </div>
    <div class="header-right">
      <div class="goal-pill" id="goal-pill">2026 年目標：30 本</div>
      <div class="updated" id="updated-lbl"></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat s-amber"><div class="stat-num" id="s-done">0</div><div class="stat-lbl">已完成</div></div>
    <div class="stat s-teal"><div class="stat-num" id="s-reading">0</div><div class="stat-lbl">閱讀中</div></div>
    <div class="stat s-coral"><div class="stat-num" id="s-want">0</div><div class="stat-lbl">想讀</div></div>
    <div class="stat s-purple"><div class="stat-num" id="s-avg">—</div><div class="stat-lbl">平均評分</div></div>
  </div>

  <div class="filter-row">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="reading">閱讀中</button>
    <button class="chip" data-f="done">已完成</button>
    <button class="chip" data-f="want">想讀</button>
    <button class="chip" data-f="paused">暫停</button>
    <button class="add-main-btn" id="open-add">＋ 新增書本</button>
  </div>

  <div class="sec-label" id="grid-label">書單</div>
  <div class="books-grid" id="books-grid"></div>

  <div class="divider"></div>

  <div class="sec-label">本月精選 · Spotlight</div>
  <div class="spotlight" id="spotlight">
    <div class="cover-box">📗</div>
    <div><div class="sp-title" style="color:var(--text-hint);font-style:italic;font-size:15px;">尚無已完成的書</div></div>
  </div>

  <div class="prog-header">
    <div class="prog-title">今年閱讀進度</div>
    <div class="prog-pct" id="prog-pct">0%</div>
  </div>
  <div class="prog-sub" id="prog-sub">已完成 0 本 · 目標 30 本</div>
  <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
  <div class="bar-labels"><span>0</span><span>30 本</span></div>

  <div class="divider"></div>

  <div class="sec-label">分類總覽</div>
  <div class="cat-grid" id="cat-grid"></div>

  <footer class="footer">
    <span>📚 我的書架 · 資料存在瀏覽器</span>
    <span>點書卡查看詳情 · hover 可編輯/刪除</span>
  </footer>
</div>

<!-- Add / Edit Modal -->
<div class="overlay" id="form-overlay">
  <div class="modal">
    <button class="close-btn" id="form-close">✕</button>
    <div class="modal-hd" id="form-title">新增書本</div>
    <div class="form-grid">
      <div>
        <div class="field-label">書名 *</div>
        <input class="f-input" id="f-book-title" placeholder="書名" type="text">
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">作者</div>
          <input class="f-input" id="f-author" placeholder="作者" type="text">
        </div>
        <div>
          <div class="field-label">出版社</div>
          <input class="f-input" id="f-publisher" placeholder="出版社" type="text">
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">狀態</div>
          <select class="f-select" id="f-status">
            <option value="want">想讀</option>
            <option value="reading">閱讀中</option>
            <option value="done">已完成</option>
            <option value="paused">暫停</option>
          </select>
        </div>
        <div>
          <div class="field-label">評分</div>
          <select class="f-select" id="f-stars">
            <option value="0">— 未評分</option>
            <option value="1">★</option>
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">分類（可自行輸入新分類）</div>
          <input class="f-input" id="f-cat" list="cat-options" placeholder="選擇或輸入分類" autocomplete="off">
          <datalist id="cat-options">
            <option value="自我成長">
            <option value="心理學">
            <option value="商業">
            <option value="投資理財">
            <option value="設計">
            <option value="文學">
            <option value="歷史">
            <option value="科學">
            <option value="語言學習">
          </datalist>
        </div>
        <div>
          <div class="field-label">語言</div>
          <select class="f-select" id="f-lang">
            <option value="中文">中文</option>
            <option value="英文">英文</option>
            <option value="日文">日文</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div>
          <div class="field-label">開始日期</div>
          <input class="f-input" id="f-start" type="date">
        </div>
        <div>
          <div class="field-label">完讀日期</div>
          <input class="f-input" id="f-end" type="date">
        </div>
      </div>
      <div>
        <div class="field-label">推薦人</div>
        <input class="f-input" id="f-recommender" placeholder="誰推薦的？" type="text">
      </div>
      <div>
        <div class="field-label">我的心得</div>
        <textarea class="f-textarea" id="f-note" placeholder="讀完的感受、收穫、生活連結…" rows="3"></textarea>
      </div>
      <div>
        <div class="field-label">名言摘錄（每行一條，可填多條）</div>
        <textarea class="f-textarea" id="f-quote" placeholder="書中觸動你的句子，一行一條&#10;例如：&#10;好習慣的建立來自系統，而非意志力。&#10;每個決定都是一次身份選擇。" rows="4"></textarea>
      </div>
      <button class="submit-btn" id="f-submit">加入書架</button>
      <div id="f-delete-wrap" style="display:none">
        <button class="del-btn" id="f-delete">刪除這本書</button>
        <div id="f-confirm-wrap" style="display:none;margin-top:8px;background:#FCEBEB;border-radius:var(--r-md);padding:12px 14px;text-align:center;">
          <div style="font-size:13px;color:#A32D2D;margin-bottom:10px;">確定要刪除這本書嗎？</div>
          <div style="display:flex;gap:8px;justify-content:center;">
            <button id="f-confirm-yes" style="font-family:'DM Sans',sans-serif;background:#A32D2D;color:#fff;border:none;padding:7px 20px;border-radius:20px;font-size:12px;cursor:pointer;">確定刪除</button>
            <button id="f-confirm-no" style="font-family:'DM Sans',sans-serif;background:transparent;border:0.5px solid #A32D2D;color:#A32D2D;padding:7px 20px;border-radius:20px;font-size:12px;cursor:pointer;">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detail-overlay">
  <div class="modal">
    <button class="close-btn" id="detail-close">✕</button>
    <div class="detail-top">
      <div class="detail-cover" id="d-cover">📗</div>
      <div>
        <div class="detail-title" id="d-title"></div>
        <div class="detail-author" id="d-author"></div>
        <div id="d-badges"></div>
      </div>
    </div>
    <table class="prop-table" id="d-props"></table>
    <div id="d-note-section"></div>
    <div id="d-quote-section"></div>
    <button class="detail-edit-btn" id="d-edit-btn">✏️ 編輯這本書</button>
  </div>
</div>

<script>
const COVERS = ['📘','📗','📕','📙','📒','📓'];
const CAT_EMOJI = {'自我成長':'🌱','心理學':'🧠','商業':'💼','投資理財':'💰','設計':'🎨','文學':'📜','歷史':'🏛️','科學':'🔬','語言學習':'🗣️','其他':'📌'};
const CAT_COLOR = {'自我成長':'amber','心理學':'purple','商業':'amber','投資理財':'teal','設計':'coral','文學':'gray','歷史':'teal','科學':'blue','語言學習':'coral','其他':'gray'};
const STATUS_LABEL = {done:'✦ 已完成',reading:'▶ 閱讀中',want:'◯ 想讀',paused:'⏸ 暫停'};
const STATUS_COLOR_KEY = {done:'teal',reading:'blue',want:'coral',paused:'amber'};

let books = JSON.parse(localStorage.getItem('myShelf') || '[]');
if(!books.length) books = [
  {id:uid(),title:'原子習慣',author:'James Clear',publisher:'方智出版',status:'done',stars:5,cat:'自我成長',lang:'中文',start:'2025-02-15',end:'2025-03-02',recommender:'朋友推薦',note:'建立習慣最重要的是「系統」而不是「目標」。habit loop 的概念讓我重新理解拖延的原因。',quote:'你並不是在達成目標時才改變，而是在建立系統時就已改變。'},
  {id:uid(),title:'人類大歷史',author:'Yuval Noah Harari',publisher:'天下文化',status:'reading',stars:4,cat:'歷史',lang:'中文',start:'2025-04-01',end:'',recommender:'書單推薦',note:'讀到智人如何透過「虛構故事」建立大規模合作，讓我重新思考品牌行銷的本質。',quote:''},
  {id:uid(),title:'思考，快與慢',author:'Daniel Kahneman',publisher:'天下文化',status:'done',stars:4,cat:'心理學',lang:'中文',start:'2024-10-10',end:'2024-11-20',recommender:'課程推薦',note:'系統一與系統二的框架非常實用，讓我更理解自己的決策偏誤。',quote:'我們對自己認識自己的能力，往往過於自信。'},
  {id:uid(),title:'挪威的森林',author:'村上春樹',publisher:'時報出版',status:'paused',stars:3,cat:'文學',lang:'日文',start:'2025-01-05',end:'',recommender:'',note:'讀到一半暫停，氛圍很特別，像霧中漫步。',quote:''},
  {id:uid(),title:'設計的法則',author:'William Lidwell',publisher:'原點',status:'want',stars:0,cat:'設計',lang:'中文',start:'',end:'',recommender:'',note:'',quote:''},
  {id:uid(),title:'窮查理的普通常識',author:'Charlie Munger',publisher:'商業周刊',status:'want',stars:0,cat:'商業',lang:'中文',start:'',end:'',recommender:'',note:'',quote:''},
];
save();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function save(){localStorage.setItem('myShelf',JSON.stringify(books));}
function formatDate(d){if(!d)return '';const[y,m,day]=d.split('-');return `${y}/${m}/${day}`;}
function starsStr(n,colored=true){
  if(!n)return `<span class="stars empty">★★★★★</span>`;
  return `<span class="stars">${'★'.repeat(n)}</span><span class="stars empty">${'★'.repeat(5-n)}</span>`;
}
function catColor(cat){return CAT_COLOR[cat]||'gray';}
function coverEmoji(id){return COVERS[id.charCodeAt(0)%COVERS.length];}
function spineColor(b){
  if(b.cat&&CAT_COLOR[b.cat]) return CAT_COLOR[b.cat];
  return STATUS_COLOR_KEY[b.status]||'gray';
}

let currentFilter = 'all';
let currentCatFilter = '';
let editingId = null;

function render(){
  let filtered = currentFilter==='all' ? books : books.filter(b=>b.status===currentFilter);
  if(currentCatFilter) filtered = filtered.filter(b=>b.cat===currentCatFilter);
  const grid = document.getElementById('books-grid');
  if(!filtered.length){
    grid.innerHTML = `<div class="empty-state">沒有符合的書，快去新增一本吧！</div>`;
  } else {
    grid.innerHTML = filtered.map(b=>{
      const sc = spineColor(b);
      const cc = catColor(b.cat);
      return `<div class="book-card" data-id="${b.id}">
        <div class="spine ${sc}"></div>
        <div class="card-actions">
          <button class="act-btn edit-btn" data-id="${b.id}" title="編輯">✏️</button>
          <button class="act-btn del-btn-card" data-id="${b.id}" title="刪除">🗑️</button>
        </div>
        <div class="card-body">
          <div class="bstatus ${b.status}">${STATUS_LABEL[b.status]}</div>
          <div class="btitle">${b.title}</div>
          <div class="bauthor">${b.author||''}</div>
          ${b.end ? `<div class="bdate">完讀 ${formatDate(b.end)}</div>` : b.start ? `<div class="bdate">開始 ${formatDate(b.start)}</div>` : ''}
          <div class="card-footer">
            <div>${starsStr(b.stars)}</div>
            ${b.cat ? `<span class="tag ${cc}">${b.cat}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('grid-label').textContent = `書單 · ${filtered.length} 本${currentCatFilter?' · '+currentCatFilter:''}`;

  const done = books.filter(b=>b.status==='done').length;
  const reading = books.filter(b=>b.status==='reading').length;
  const want = books.filter(b=>b.status==='want').length;
  const rated = books.filter(b=>b.stars>0);
  const avg = rated.length ? (rated.reduce((s,b)=>s+b.stars,0)/rated.length).toFixed(1) : '—';
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-reading').textContent = reading;
  document.getElementById('s-want').textContent = want;
  document.getElementById('s-avg').textContent = avg;

  const goal = 30;
  const pct = Math.round(Math.min(done/goal*100,100));
  document.getElementById('bar-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-sub').textContent = `已完成 ${done} 本 · 目標 ${goal} 本`;

  const spotlight = books.filter(b=>b.status==='done'&&b.stars>=4).sort((a,b_)=>b_.stars-a.stars)[0]
    || books.filter(b=>b.status==='done')[0];
  const spEl = document.getElementById('spotlight');
  if(spotlight){
    spEl.innerHTML = `<div class="cover-box">${coverEmoji(spotlight.id)}</div>
      <div>
        <div class="sp-title">${spotlight.title}</div>
        <div class="sp-author">${spotlight.author||''}${spotlight.publisher?' · '+spotlight.publisher:''}${spotlight.end?' · '+formatDate(spotlight.end)+' 讀完':''}</div>
        ${spotlight.quote?`<div class="sp-quote">${spotlight.quote}</div>`:
          spotlight.note?`<div class="sp-quote">${spotlight.note.slice(0,60)}${spotlight.note.length>60?'…':''}</div>`:''}
      </div>`;
  } else {
    spEl.innerHTML = `<div class="cover-box">📗</div><div><div class="sp-title" style="color:var(--text-hint);font-style:italic;font-size:15px;">尚無已完成的書</div></div>`;
  }

  const catMap = {};
  books.forEach(b=>{if(b.cat){catMap[b.cat]=(catMap[b.cat]||0)+1;}});
  const sortedCats = Object.entries(catMap).sort((a,b_)=>b_[1]-a[1]).slice(0,8);
  document.getElementById('cat-grid').innerHTML = sortedCats.length
    ? sortedCats.map(([c,n])=>`<div class="cat-card" data-cat="${c}"><div class="cat-emoji">${CAT_EMOJI[c]||'📌'}</div><div class="cat-count">${n}</div><div class="cat-name">${c}</div></div>`).join('')
    : '<div style="grid-column:1/-1;font-size:13px;color:var(--text-hint);padding:1rem;">新增書本後會出現分類統計</div>';

  document.querySelectorAll('.cat-card').forEach(card=>{
    card.addEventListener('click',()=>{
      const cat = card.dataset.cat;
      currentCatFilter = cat;
      currentFilter = 'all';
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      document.querySelector('.chip[data-f="all"]').classList.add('on');
      render();
      document.getElementById('books-grid').scrollIntoView({behavior:'smooth',block:'start'});
    });
  });

  document.getElementById('updated-lbl').textContent = '更新於 '+ new Date().toLocaleDateString('zh-TW');

  grid.querySelectorAll('.book-card').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('.act-btn')) return;
      openDetail(card.dataset.id);
    });
  });
  grid.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();openEdit(btn.dataset.id);});
  });
  grid.querySelectorAll('.del-btn-card').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();deleteBook(btn.dataset.id);});
  });
}

function openDetail(id){
  const b = books.find(x=>x.id===id);
  if(!b) return;
  document.getElementById('d-cover').textContent = coverEmoji(b.id);
  document.getElementById('d-title').textContent = b.title;
  document.getElementById('d-author').textContent = [b.author,b.publisher].filter(Boolean).join(' · ');
  document.getElementById('d-badges').innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
    <span class="tag ${STATUS_COLOR_KEY[b.status]||'gray'}" style="font-size:11px;">${STATUS_LABEL[b.status]}</span>
    ${b.cat?`<span class="tag ${catColor(b.cat)}">${b.cat}</span>`:''}
    <span style="font-size:12px;color:var(--amber-400)">${b.stars?'★'.repeat(b.stars):''}</span>
  </div>`;
  const rows = [
    b.lang&&`<tr><td class="prop-key">語言</td><td>${b.lang}</td></tr>`,
    b.start&&`<tr><td class="prop-key">開始日期</td><td>${formatDate(b.start)}</td></tr>`,
    b.end&&`<tr><td class="prop-key">完讀日期</td><td>${formatDate(b.end)}</td></tr>`,
    b.recommender&&`<tr><td class="prop-key">推薦人</td><td>${b.recommender}</td></tr>`,
  ].filter(Boolean);
  document.getElementById('d-props').innerHTML = rows.join('');
  document.getElementById('d-note-section').innerHTML = b.note
    ? `<div class="note-lbl">我的心得</div><div class="note-box">${b.note}</div>`:'';

  const quotes = (b.quote||'').split('\n').map(q=>q.trim()).filter(Boolean);
  document.getElementById('d-quote-section').innerHTML = quotes.length
    ? `<div class="note-lbl">名言摘錄</div><div class="quote-list">${
        quotes.map((q,i)=>`<div class="quote-row">
          <div class="quote-num">${i+1}</div>
          <div class="quote-text">${q}</div>
        </div>`).join('')
      }</div>` : '';  document.getElementById('d-edit-btn').onclick = ()=>{
    closeDetail(); openEdit(id);
  };
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(){document.getElementById('detail-overlay').classList.remove('open');}

function refreshCatOptions(){
  const existing = [...new Set(books.map(b=>b.cat).filter(Boolean))];
  const defaults = ['自我成長','心理學','商業','投資理財','設計','文學','歷史','科學','語言學習'];
  const all = [...new Set([...defaults,...existing])];
  const dl = document.getElementById('cat-options');
  dl.innerHTML = all.map(c=>`<option value="${c}">`).join('');
}

function openAdd(){
  refreshCatOptions();
  editingId = null;
  document.getElementById('form-title').textContent = '新增書本';
  document.getElementById('f-submit').textContent = '加入書架';
  document.getElementById('f-delete').style.display = 'none';
  document.getElementById('f-delete-wrap').style.display = 'none';
  document.getElementById('f-confirm-wrap').style.display = 'none';
  ['f-book-title','f-author','f-publisher','f-start','f-end','f-recommender','f-note','f-quote','f-cat'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value = 'want';
  document.getElementById('f-stars').value = '0';
  document.getElementById('f-cat').value = '';
  document.getElementById('f-lang').value = '中文';
  document.getElementById('form-overlay').classList.add('open');
}

function openEdit(id){
  const b = books.find(x=>x.id===id);
  if(!b){ alert('找不到這本書'); return; }
  editingId = b.id;
  refreshCatOptions();
  document.getElementById('form-title').textContent = '編輯書本';
  document.getElementById('f-submit').textContent = '儲存修改';
  document.getElementById('f-delete').style.display = '';
  document.getElementById('f-delete-wrap').style.display = '';
  document.getElementById('f-confirm-wrap').style.display = 'none';
  document.getElementById('f-book-title').value = b.title;
  document.getElementById('f-author').value = b.author||'';
  document.getElementById('f-publisher').value = b.publisher||'';
  document.getElementById('f-status').value = b.status;
  document.getElementById('f-stars').value = String(b.stars||0);
  document.getElementById('f-cat').value = b.cat||'';
  document.getElementById('f-lang').value = b.lang||'中文';
  document.getElementById('f-start').value = b.start||'';
  document.getElementById('f-end').value = b.end||'';
  document.getElementById('f-recommender').value = b.recommender||'';
  document.getElementById('f-note').value = b.note||'';
  document.getElementById('f-quote').value = b.quote||'';
  document.getElementById('form-overlay').classList.add('open');
}

document.getElementById('f-submit').addEventListener('click',()=>{
  const title = document.getElementById('f-book-title').value.trim();
  if(!title){document.getElementById('f-book-title').focus();return;}
  const currentEditingId = editingId;
  const data = {
    id: currentEditingId || uid(),
    title,
    author: document.getElementById('f-author').value.trim(),
    publisher: document.getElementById('f-publisher').value.trim(),
    status: document.getElementById('f-status').value,
    stars: parseInt(document.getElementById('f-stars').value)||0,
    cat: document.getElementById('f-cat').value.trim(),
    lang: document.getElementById('f-lang').value,
    start: document.getElementById('f-start').value,
    end: document.getElementById('f-end').value,
    recommender: document.getElementById('f-recommender').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    quote: document.getElementById('f-quote').value.trim(),
  };
  if(currentEditingId){
    const idx = books.findIndex(b=>b.id===currentEditingId);
    if(idx>-1){
      books[idx]=data;
    } else {
      books.unshift(data);
    }
  } else {
    books.unshift(data);
  }
  editingId = null;
  save(); render();
  document.getElementById('form-overlay').classList.remove('open');
});

function deleteBook(id){
  books = books.filter(b=>b.id!==id);
  save(); render();
  document.getElementById('form-overlay').classList.remove('open');
  document.getElementById('detail-overlay').classList.remove('open');
}

document.getElementById('open-add').addEventListener('click', openAdd);
document.getElementById('form-close').addEventListener('click',()=>{
  document.getElementById('form-overlay').classList.remove('open');
  document.getElementById('f-confirm-wrap').style.display='none';
});
document.getElementById('form-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('form-overlay')){document.getElementById('form-overlay').classList.remove('open');document.getElementById('f-confirm-wrap').style.display='none';}});
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('detail-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('detail-overlay'))closeDetail();});

document.getElementById('f-delete').addEventListener('click',()=>{
  document.getElementById('f-confirm-wrap').style.display='';
});
document.getElementById('f-confirm-no').addEventListener('click',()=>{
  document.getElementById('f-confirm-wrap').style.display='none';
});
document.getElementById('f-confirm-yes').addEventListener('click',()=>{
  if(editingId) deleteBook(editingId);
});

document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    currentFilter = c.dataset.f;
    currentCatFilter = '';
    render();
  });
});

render();
</script>
</body>
</html>
